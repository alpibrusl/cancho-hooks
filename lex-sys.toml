# The project file (lex-sys docs/package-system.md section 8): the compiler these sources were written for, the libraries
# they use, and the programs to build. `lex-sys build` installs the libraries and builds the programs; `lex-sys add` adds
# a library, pinned to a commit.

[package]
name = "hooks"
lex-sys = "d7228ca75604b5c27130485b95371a2e16109fef"

[dependencies.log]
git = "https://github.com/alpibrusl/lexsys-log"
rev = "6b4f46fd045f9e6c1a3f4bda22ee9d850daf63d1"
path = ".lex-sys-vcs/log"

[dependencies.server]
git = "https://github.com/alpibrusl/lex-sys"
rev = "f804ce7e6fcf5717ea52442bf648a1fe81090f98"
path = "packages/http-server/.lex-sys-vcs"

# The API, declared once (src/api.ls): `web` makes the router and the OpenAPI document from one declaration, and `schema` is what the
# declaration's bodies and answers are written in. `web` is a package of lexsys-web (its store is published by scripts/publish.sh there) and
# records `schema` as its own requirement; the project names `schema` as well because its sources import it.
[dependencies.schema]
git = "https://github.com/alpibrusl/lexsys-schema"
rev = "10d30edab333e5cfb5445c430020ed1999872e2f"
path = ".lex-sys-vcs"

[dependencies.web]
git = "https://github.com/alpibrusl/lexsys-web"
rev = "0deab12a4000d3b6f2be893ea0439bcc34e0dbdf"
path = ".lex-sys-vcs"

[[bin]]
name = "hooks"
sources = ["src"]
std = true

# The OpenAPI document, printed (tools/openapi.ls; `scripts/openapi.sh` writes docs/openapi.json from it). It is built from the declaration the
# service routes with (src/api.ls) and nothing else: no network, no clock, no filesystem, no foreign code.
[[bin]]
name = "hooks-openapi"
sources = ["tools/openapi.ls", "src/api.ls"]
std = true

# The probe that tests signing and base64 on their own (tests/sign_test.py).
[[bin]]
name = "sign_probe"
sources = ["tests/sign_probe.ls", "src/sign.ls"]
std = true

# The probe that tests cron expressions against an independent implementation (tests/cron_test.py).
[[bin]]
name = "cron_probe"
sources = ["tests/cron_probe.ls", "src/cron.ls"]
std = true

# The MCP server for agents (docs/design.md section 51, docs/agents.md): its own sources, and none of the service's.
[[bin]]
name = "hooks-mcp"
sources = ["tools/mcp.ls"]
std = true

# The log checker (docs/design.md section 54): the same checks as scripts/logcheck.py, about 50 times faster on the one sample measured; backup.sh and restore.sh use it when it is built.
[[bin]]
name = "hooks-logcheck"
sources = ["tools/logcheck.ls", "src/logguard.ls", "src/state.ls", "src/store.ls"]
std = true

# The unit tests (`lex-sys test`): each set is run against the installed libraries.
[[test]]
name = "state"
sources = ["tests/state_test.ls", "src/state.ls"]
std = true

[[test]]
name = "endpoints"
sources = ["tests/endpoints_test.ls", "src/endpoints.ls", "src/destination.ls", "src/sign.ls", "src/state.ls", "src/epx.ls", "src/filter.ls", "src/hdrs.ls"]
std = true

