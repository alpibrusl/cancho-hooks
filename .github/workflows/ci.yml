name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built with. A source file does not record which `std` it was written against, so the
  # revision is part of the contract. It is lex-sys main with packages across repositories (#192): `vcs fetch` of a lock with
  # an origin. The two libraries are not pinned here but in `deps/` (`scripts/lock.sh` moves them).
  LEX_SYS_REV: f804ce7e6fcf5717ea52442bf648a1fe81090f98

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hooks

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ env.LEX_SYS_REV }}
          path: lex-sys

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ env.LEX_SYS_REV }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: Formatting
        working-directory: hooks
        run: ../lex-sys/target/release/lex-sys fmt --check src

      - name: Build the service and the fsync shim
        working-directory: hooks
        run: LEX_SYS=../lex-sys/target/release/lex-sys scripts/build.sh build/hooks

      - name: The reference library for Standard Webhooks
        run: pip install standardwebhooks

      - name: Unit tests (the delivery window, the endpoints file, the idempotency index)
        working-directory: hooks
        run: |
          ../lex-sys/target/release/lex-sys test tests/state_test.ls src/state.ls build/deps/*.ls --std
          ../lex-sys/target/release/lex-sys test tests/endpoints_test.ls src/endpoints.ls src/sign.ls src/state.ls build/deps/*.ls --std
          ../lex-sys/target/release/lex-sys test tests/idem_test.ls src/idem.ls --std

      - name: Signatures and base64 against the reference library
        working-directory: hooks
        run: python3 tests/sign_test.py build/sign_probe

      - name: One delivery attempt, against each kind of receiver
        working-directory: hooks
        run: python3 tests/attempt_test.py build/hooks

      - name: The retry schedule, across restarts
        working-directory: hooks
        run: python3 tests/retry_test.py build/hooks

      - name: A stalled, slow or blackholed endpoint, and what it costs the others
        working-directory: hooks
        run: python3 tests/isolation_test.py build/hooks

      - name: No acknowledged event is lost (kill -9 as a power cut)
        working-directory: hooks
        run: python3 tests/chaos.py build/hooks 2000 8 50

      - name: Three endpoints, signed, retried, dead-lettered, with the service killed
        working-directory: hooks
        run: python3 tests/delivery.py build/hooks 300 4 150

      - name: Idempotency keys (the contract, refusals, restarts, chaos, a broken log, the full index)
        working-directory: hooks
        run: FULL=1 python3 tests/idempotency_test.py build/hooks
