name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-shards:
    # The job is split in parallel shards (scripts/shard_ci.py made the split from the durations of a run, longest step first): each shard
    # builds the service and runs its share of the steps, with a PostgreSQL of its own. The job `test` below needs them all.
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d]
    runs-on: ubuntu-latest
    # A PostgreSQL that wants a password (SCRAM-SHA-256), for the history test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: hooks
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: hooks

      # The compiler is whichever commit cancho.toml says these sources were written for: one place, which the compiler
      # itself checks (`cancho build` refuses any other).
      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' hooks/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Formatting
        if: matrix.shard == 'b'
        working-directory: hooks
        run: ../cancho/target/release/cancho fmt --check src tools

      # The service is linked against OpenSSL (src/ossl.cho; scripts/cc-ssl.sh adds -lssl -lcrypto) and its tests of https use the `openssl` command to make certificates.
      - name: OpenSSL (the development files to link against, and the command the tests make certificates with)
        run: |
          dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q libssl-dev openssl)
          openssl version

      - name: Install the libraries, build the service and the fsync shim
        working-directory: hooks
        run: CANCHO=../cancho/target/release/cancho scripts/build.sh

      # The API is declared once (src/api.cho): the router is made from the declaration, and so is docs/openapi.json. A change to the API is a change
      # to that file, and this step is red until it is committed (`scripts/openapi.sh`).
      - name: docs/openapi.json is what the declaration says (generated by hooks-openapi, which has the console and nothing else)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: CANCHO=../cancho/target/release/cancho scripts/openapi.sh --check

      # What the service can do, as `cancho authority` reports it, is pinned in docs/authority.json. A new foreign call or capability changes the report,
      # and the step is red until a person reads the diff and commits the new file (`scripts/check-authority.sh --update`): that commit is the approval.
      - name: The authority report is the committed one (every foreign symbol the service can call, by library)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: CANCHO=../cancho/target/release/cancho scripts/check-authority.sh

      # `hooks-mcp` (docs/agents.md) holds no foreign function and no `Ffi`: its report is pinned in docs/authority-mcp.json (the same way, `--mcp`).
      # `hooks-logcheck` (tools/logcheck.cho) reads the logs and, for `trim`, cuts a torn tail: its report is pinned in docs/authority-logcheck.json too.
      - name: The authority report of hooks-logcheck is the committed one (no foreign function; it reads the data directory, and only trim writes it)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: CANCHO=../cancho/target/release/cancho scripts/check-authority.sh --logcheck

      - name: The authority report of hooks-mcp is the committed one (no foreign function; the console, the network, the clock, the token file)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: CANCHO=../cancho/target/release/cancho scripts/check-authority.sh --mcp

      - name: The reference library for Standard Webhooks
        run: pip install standardwebhooks

      - name: Unit tests (the delivery window, the endpoints file, the idempotency index, the settings, the reasons, the counters and the text of /metrics, the spread of retries, the limits, the table of dead letters, the requests about them)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: ../cancho/target/release/cancho test

      - name: Cron expressions against an independent implementation (calendar, steps, day-of-month and day-of-week, leap days)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/cron_test.py build/cron_probe 500

      - name: Signatures and base64 against the reference library
        if: matrix.shard == 'c'
        working-directory: hooks
        run: python3 tests/sign_test.py build/sign_probe

      - name: Settings, from a file and from flags (precedence, refusals)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/config_test.py build/hooks

      - name: Credentials on every route (every route against no token, a wrong one, and each scope's, in five ways of configuring them; no token leaks)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: python3 tests/authz_test.py build/hooks

      - name: The MCP server for agents (the protocol and every error, read-only by default, the requests it makes and the answers it reads against scripted services, every tool against the real service, tokens and the plaintext rule, a database)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: |
          which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/mcp_test.py build/hooks

      - name: The history of attempts in PostgreSQL (a database that is slow, gone, wrong)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: |
          which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/history_test.py build/hooks

      - name: The endpoints in PostgreSQL (import, read at start, every refusal)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/roster_test.py build/hooks

      - name: The production profile (each unsafe setting or mode is a refusal of its own; all safe starts)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/production_test.py build/hooks

      - name: The delivery state's regions do not overlap (an event that fails in the same place of each window)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/layout_test.py build/hooks

      - name: POST /endpoints and GET /endpoints/:id (the token, the request, the database first, from now)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/manage_test.py build/hooks

      - name: Endpoint ids and slots (the log says which endpoint has which slot)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/slots_test.py build/hooks

      - name: More than 62 endpoints (1,024 through the API and a 1,025th refused, kill -9 over 1,024 endpoints that fail, disabled and paused in every slot, replays and dead letters in a wide slot, the loop not looking at what has nothing to do, retention pins, a database that is away at the start, the logs an older build refuses)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/many_test.py build/hooks

      - name: Change an endpoint without a restart (PATCH)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/patch_test.py build/hooks

      - name: Delete an endpoint without a restart (DELETE)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/delete_test.py build/hooks

      - name: Event types per endpoint (the matching rules against a model, 3,000 events nobody wants, a dead endpoint, kill -9, a log from before the type, replay)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/filter_test.py build/hooks

      - name: "A restart remembers where an endpoint with a list of types was (no event sent again after SIGTERM, kill -9 or snapshots; no record for an endpoint without a list)"
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/advance_test.py build/hooks

      - name: "The history is pruned (rows older than history-days deleted in batches, the recent ones kept, 0 keeps every row)"
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/prune_test.py build/hooks

      - name: "The database's host may be a name (resolved by the service, the loop not held by a slow name server, looked up again after a lost connection)"
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/dbname_test.py build/hooks

      - name: "The audit log (what is written and what is not, a held change and its outcome, no secret in the file, rotation, production refuses it off, a full disk)"
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/audit_test.py build/hooks

      - name: "A hard maximum age (pinned segments dropped at the age, cursors moved, replays ended, events counted as expired, a restart agrees)"
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/maxage_test.py build/hooks

      - name: "Erasure of one event (the body gone from the segment's bytes, never sent, replayed or served, the active segment, kill -9 at each step of the rewrite)"
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/erase_test.py build/hooks

      - name: "Bodies encrypted at rest (no body in the files, delivery and GET the same, a start without the key refused, rotation, a log that began in the clear)"
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/encrypt_test.py build/hooks

      - name: Secret rotation (two signatures checked with the reference library, restarts, every refusal)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/rotation_test.py build/hooks

      - name: Custom headers (on the wire, never in a read, every forbidden name, CRLF injection, the limits, the largest event)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/headers_test.py build/hooks

      - name: Ten endpoints beside 64 connections (a start beyond them is not a failure)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: python3 tests/saturation_test.py build/hooks

      - name: Where a delivery may go (no private, loopback or reserved addresses; a name is a name, judged at every attempt)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/ssrf_test.py build/hooks

      - name: Names, and the SSRF rule at every attempt (a name that resolves to a private address, rebinding, a name server that fails or is slow, the loop not held)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/names_test.py build/hooks

      - name: Delivery over TLS (every certificate failure has its own reason, the handshake, the deadline, kill -9 in a handshake, 64 held handshakes)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/https_test.py build/hooks

      - name: The scheme of an endpoint over the API, the file, the table, a backup and a restore
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/https_api_test.py build/hooks

      - name: TLS sessions (resumption seen from the receiver, dropped when the endpoint changes, no leaks)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/sessions_test.py build/hooks

      - name: Kept connections (reuse, each framing, the race of a closed connection, the bounds, a burst, a PATCH and a 410; docs/design.md section 53)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/keepalive_test.py build/hooks

      - name: Replay an event to one endpoint or all
        if: matrix.shard == 'd'
        working-directory: hooks
        run: python3 tests/replay_test.py build/hooks

      - name: 410 Gone disables an endpoint; enabling it again
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/gone_test.py build/hooks

      - name: One delivery attempt, against each kind of receiver
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/attempt_test.py build/hooks

      - name: The retry schedule, across restarts
        if: matrix.shard == 'c'
        working-directory: hooks
        run: python3 tests/retry_test.py build/hooks

      - name: A stalled, slow or blackholed endpoint, and what it costs the others
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/isolation_test.py build/hooks

      - name: A dead endpoint does not stop the others (a scan position per endpoint; revived; kill -9 in the middle)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/scan_test.py build/hooks

      - name: The circuit breaker (a run of failures, a pause after N days, its events wait, enable)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/breaker_test.py build/hooks

      - name: Dead letters you can list and replay in bulk (pages, kill -9, the bound of 32 waiting replays, the table of 2,048, a log from before the time of death)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/dead_test.py build/hooks

      - name: Cancel a waiting replay (one or all, durable across kill -9 and a power cut, never an attempt on the wire)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/cancel_test.py build/hooks

      - name: Retry jitter (bounds, 0 is the schedule, a function of endpoint, event and attempt, the recorded time survives kill -9)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/jitter_test.py build/hooks

      - name: Concurrency and rate per endpoint (observed at the receiver, held-back events are not failures, one slow endpoint does not slow another, the table, endpoints.conf, an old schema)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/limits_test.py build/hooks

      - name: No acknowledged event is lost (kill -9 as a power cut)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: python3 tests/chaos.py build/hooks 2000 8 50

      - name: Backup and restore (total loss, kill -9 under online backups, every refusal)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/backup_test.py build/hooks

      - name: Retention (bounded logs; segments dropped, pins, the snapshot, formats, keys expiring, kill -9 at every step of a compaction, compact-now, the stall)
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 tests/retention_test.py build/hooks

      - name: "No memory kept by a call that changes the database, or by a schedule's fire (PATCH, create and delete, bulk replay, schedules, keyed events; two rounds, the second at most 1 KiB a call)"
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/leak_test.py build/hooks

      - name: The shell scripts
        if: matrix.shard == 'a'
        working-directory: hooks
        run: shellcheck -x scripts/*.sh scripts/soak/*.sh deploy/*.sh examples/*.sh

      # Seven use cases as scripts (examples/), each run against the service and exiting 0 only if every expectation it prints held; the page docs/examples.html
      # is then held to what they printed (every block marked data-example="N" is lines of script N's output, in order), and receiver.py to the reference library.
      - name: "The examples (each script against the service; the page docs/examples.html is only what they printed; the receiver agrees with the reference library; the checks can fail)"
        if: matrix.shard == 'b'
        working-directory: hooks
        run: |
          which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/examples_test.py build/hooks

      # The checker of the soak test (docs/soak.md) against synthetic ledgers that are mutated: every mutation must be caught under its own tag. Seconds; no service.
      - name: The soak harness's checker catches what it must
        if: matrix.shard == 'a'
        working-directory: hooks
        run: python3 scripts/soak/soak.py --selftest-ledger

      - name: Three endpoints, signed, retried, dead-lettered, with the service killed
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/delivery.py build/hooks 300 4 150

      - name: Idempotency keys (the contract, refusals, restarts, chaos, a broken log, the full index)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: FULL=1 python3 tests/idempotency_test.py build/hooks

      - name: Schedules (the admin token, every refusal, a fire is an ordinary event, missed fires, kill -9 between the event and the database, a real minute)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: FULL=1 HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/schedules_test.py build/hooks

      - name: Stopping (SIGTERM and SIGINT drain, a second signal ends it at once, under load nothing is lost or repeated)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: python3 tests/stop_test.py build/hooks

      - name: OpenAPI (docs/openapi.json describes exactly the routes and scopes of the table, and the service's answers fit it)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/openapi_test.py build/hooks

      - name: Refuse corruption (a delivery log ahead of its events log, damage in the middle of a log, a torn tail still recovered, --repair-logs)
        if: matrix.shard == 'd'
        working-directory: hooks
        run: python3 tests/corrupt_test.py build/hooks

      - name: Native log checker (hooks-logcheck agrees with scripts/logcheck.py on clean and damaged logs, trim cuts the same bytes, reads leave the files untouched)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/logcheck_test.py build/hooks

      - name: /metrics against a known workload (ingest, group commits, attempts by outcome and reason, lag, history), /readyz
        if: matrix.shard == 'd'
        working-directory: hooks
        run: |
          HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/metrics_test.py build/hooks
          HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/ready_test.py build/hooks

      - name: "A full data directory does not make the service send the same events again (no event more than twice while full, every acknowledged one after a restart)"
        if: matrix.shard == 'b'
        working-directory: hooks
        run: python3 tests/fulldisk_test.py build/hooks

      - name: Why an attempt failed (a receiver for each reason; in /attempts, /metrics, the history table and the delivery log)
        if: matrix.shard == 'b'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/reason_test.py build/hooks

      - name: A database that goes away and comes back (cut, frozen, black-holed, ended under the service; no restart, nothing lost or repeated, the loop never stalls; SCRAM logins)
        if: matrix.shard == 'c'
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/pgre_test.py build/hooks

      # Only a binary that passed every step above is kept. It is the service as built by the compiler this commit pins, linked
      # against the runner's glibc (ubuntu-latest) and so for a Linux x86-64 host with that glibc or newer. A zip loses the
      # executable bit: `chmod +x` after downloading.
      - name: Keep the service binary
        if: matrix.shard == 'a'
        run: |
          mkdir dist
          cp hooks/build/hooks dist/hooks-linux-x86_64
          (cd dist && sha256sum hooks-linux-x86_64 > hooks-linux-x86_64.sha256)
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: matrix.shard == 'a'
        with:
          name: hooks-linux-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  # The service with cancho's own TLS in place of OpenSSL (docs/pure-tls.md, cancho#210). It is a project of its own, `pure/`, which pins a newer compiler than the
  # default one, so this job builds both compilers; it builds both services and compares what the `https` tests find on each.

  # One name for all of the shards, for whoever waits for `test`.
  test:
    if: always()
    needs: test-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every step is in a shard (scripts/shard_ci.py --check)
        run: python3 scripts/shard_ci.py .github/workflows/ci.yml --check
      - name: Every shard passed
        run: test "${{ needs.test-shards.result }}" = success

  pure-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hooks

      - name: Read the two compiler pins
        id: pin
        run: |
          echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' hooks/cancho.toml)" >> "$GITHUB_OUTPUT"
          echo "pure=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' hooks/pure/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.pure }}
          path: cancho-pure

      - name: Cache the compilers
        id: compilers
        uses: actions/cache@v4
        with:
          path: |
            cancho/target/release/cancho
            cancho-pure/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}-${{ steps.pin.outputs.pure }}

      - name: Build the compilers
        if: steps.compilers.outputs.cache-hit != 'true'
        run: |
          (cd cancho && cargo build --release -p cancho)
          (cd cancho-pure && cargo build --release -p cancho)

      - name: OpenSSL (for the default service, and for the tests' certificates), and the reference library for Standard Webhooks
        run: |
          dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q libssl-dev openssl)
          pip install standardwebhooks

      - name: Build the default service, and the pure one
        working-directory: hooks
        run: |
          CANCHO=../cancho/target/release/cancho scripts/build.sh
          CANCHO_PURE=../cancho-pure/target/release/cancho scripts/build.sh --pure

      - name: The pure service links no TLS library
        working-directory: hooks
        run: "! ldd pure/build/hooks-pure | grep -Ei 'ssl|crypto'"

      - name: Formatting of the pure build's own source
        working-directory: hooks
        run: ../cancho-pure/target/release/cancho fmt --check pure/src

      - name: The pure service's authority report is the committed one (no libssl, no libcrypto)
        working-directory: hooks
        run: CANCHO=../cancho-pure/target/release/cancho scripts/check-authority.sh --pure

      - name: The https tests on both services, the outcomes compared
        working-directory: hooks
        run: python3 scripts/https_both.py

      - name: What only the pure service does (a trust store too large, no environment, close_notify, resumption, the ClientHello's psk_key_exchange_modes)
        working-directory: hooks
        run: python3 tests/pure_test.py pure/build/hooks-pure

      - name: Kept connections on the pure service (docs/design.md section 53; the PATCH check is the test job's, with the database)
        working-directory: hooks
        run: python3 tests/keepalive_test.py pure/build/hooks-pure

      - name: Retention and a power cut on the pure service (its fsync shim is in pure/build; without it the cut took flushed records and the restart was refused, status 18)
        working-directory: hooks
        run: STAGES=bounded python3 tests/retention_test.py pure/build/hooks-pure
