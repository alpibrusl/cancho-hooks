name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A PostgreSQL that wants a password (SCRAM-SHA-256), for the history test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: hooks
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: hooks

      # The compiler is whichever commit lex-sys.toml says these sources were written for: one place, which the compiler
      # itself checks (`lex-sys build` refuses any other).
      - name: Read the compiler pin from lex-sys.toml
        id: pin
        run: echo "rev=$(sed -n 's/^lex-sys *= *"\([0-9a-f]*\)".*/\1/p' hooks/lex-sys.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ steps.pin.outputs.rev }}
          path: lex-sys

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ steps.pin.outputs.rev }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: Formatting
        working-directory: hooks
        run: ../lex-sys/target/release/lex-sys fmt --check src

      - name: Install the libraries, build the service and the fsync shim
        working-directory: hooks
        run: LEX_SYS=../lex-sys/target/release/lex-sys scripts/build.sh

      - name: The reference library for Standard Webhooks
        run: pip install standardwebhooks

      - name: Unit tests (the delivery window, the endpoints file, the idempotency index, the settings)
        working-directory: hooks
        run: ../lex-sys/target/release/lex-sys test

      - name: Signatures and base64 against the reference library
        working-directory: hooks
        run: python3 tests/sign_test.py build/sign_probe

      - name: Settings, from a file and from flags (precedence, refusals)
        working-directory: hooks
        run: python3 tests/config_test.py build/hooks

      - name: The history of attempts in PostgreSQL (a database that is slow, gone, wrong)
        working-directory: hooks
        run: |
          which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/history_test.py build/hooks

      - name: The endpoints in PostgreSQL (import, read at start, every refusal)
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/roster_test.py build/hooks

      - name: The delivery state's regions do not overlap (an event that fails in the same place of each window)
        working-directory: hooks
        run: python3 tests/layout_test.py build/hooks

      - name: POST /endpoints and GET /endpoints/:id (the token, the request, the database first, from now)
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/manage_test.py build/hooks

      - name: Endpoint ids and slots (the log says which endpoint has which slot)
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/slots_test.py build/hooks

      - name: Where a delivery may go (no private, loopback or reserved addresses, no names)
        working-directory: hooks
        run: HOOKS_PG=127.0.0.1:5432:postgres:hooks HOOKS_PG_PASSWORD=pgpass python3 tests/ssrf_test.py build/hooks

      - name: Replay an event to one endpoint or all
        working-directory: hooks
        run: python3 tests/replay_test.py build/hooks

      - name: 410 Gone disables an endpoint; enabling it again
        working-directory: hooks
        run: python3 tests/gone_test.py build/hooks

      - name: One delivery attempt, against each kind of receiver
        working-directory: hooks
        run: python3 tests/attempt_test.py build/hooks

      - name: The retry schedule, across restarts
        working-directory: hooks
        run: python3 tests/retry_test.py build/hooks

      - name: A stalled, slow or blackholed endpoint, and what it costs the others
        working-directory: hooks
        run: python3 tests/isolation_test.py build/hooks

      - name: No acknowledged event is lost (kill -9 as a power cut)
        working-directory: hooks
        run: python3 tests/chaos.py build/hooks 2000 8 50

      - name: Three endpoints, signed, retried, dead-lettered, with the service killed
        working-directory: hooks
        run: python3 tests/delivery.py build/hooks 300 4 150

      - name: Idempotency keys (the contract, refusals, restarts, chaos, a broken log, the full index)
        working-directory: hooks
        run: FULL=1 python3 tests/idempotency_test.py build/hooks

      # Only a binary that passed every step above is kept. It is the service as built by the compiler this commit pins, linked
      # against the runner's glibc (ubuntu-latest) and so for a Linux x86-64 host with that glibc or newer. A zip loses the
      # executable bit: `chmod +x` after downloading.
      - name: Keep the service binary
        run: |
          mkdir dist
          cp hooks/build/hooks dist/hooks-linux-x86_64
          (cd dist && sha256sum hooks-linux-x86_64 > hooks-linux-x86_64.sha256)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: hooks-linux-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
