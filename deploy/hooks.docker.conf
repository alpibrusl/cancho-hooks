# The settings of the container image. Mount your own over /etc/hooks/hooks.conf, or override any of these with flags:
#   docker run ... lexsys-hooks --config /etc/hooks/hooks.conf --pg-host db --admin-token ...
# (a token on a command line is visible to every user of the host: prefer a mounted file, mode 0600 owned by uid 10001)
#
# THIS IS THE DEVELOPMENT PROFILE: no token is set, so every route is open to whoever can reach the port. For anything else mount a file with
#   production = 1
#   admin-token = ...
#   ingest-token = ...
# (deploy/hooks.conf.example has the whole sample and says what each setting does). The service then refuses to start unless it is safe; the image
# makes /var/lib/hooks 0700 and starts the service under umask 077 for that. A bind mount at /var/lib/hooks must be 0700 and owned by uid 10001.
port = 8080
dir = /var/lib/hooks
